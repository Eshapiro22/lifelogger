<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Dunkapedia social preview</title>
  <desc id="desc">A bold orange and black social card for Dunkapedia, the ultimate dunk encyclopedia.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#140d08"/>
      <stop offset="50%" stop-color="#2a180b"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <radialGradient id="flare" cx="75%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity=".9"/>
      <stop offset="40%" stop-color="#ff7a00" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff7a00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="34" y="34" width="1132" height="562" rx="32" fill="none" stroke="rgba(255,255,255,.12)"/>
  <circle cx="935" cy="120" r="240" fill="url(#flare)"/>

  <g transform="translate(84 86)">
    <circle cx="34" cy="34" r="34" fill="#ff7a00"/>
    <path d="M0 34h68M34 0c-9 10-14 22-14 34s5 24 14 34M34 0c9 10 14 22 14 34s-5 24-14 34" fill="none" stroke="#4a1f06" stroke-width="5" stroke-linecap="round"/>
    <text x="92" y="46" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#fff6ec">Dunkapedia</text>
  </g>

  <text x="84" y="235" font-family="Arial, sans-serif" font-size="110" font-weight="900" fill="#fff6ec">The Ultimate</text>
  <text x="84" y="340" font-family="Arial, sans-serif" font-size="110" font-weight="900" fill="#fff6ec">Dunk Encyclopedia</text>
  <text x="84" y="408" font-family="Arial, sans-serif" font-size="32" fill="#cfbfaf">Browse iconic dunks, hunt fresh clips, and filter the archive by player, era, and style.</text>

  <g transform="translate(84 470)">
    <rect width="240" height="58" rx="29" fill="#ff9f1c"/>
    <text x="32" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1a1208">53 archive entries</text>
  </g>

  <g transform="translate(360 470)">
    <rect width="300" height="58" rx="29" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.14)"/>
    <text x="28" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff6ec">No API key required</text>
  </g>
</svg>
